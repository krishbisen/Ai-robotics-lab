[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-robotics-lab"
version = "0.1.0"
description = "AI, Computer Vision and Robotics experiments"
requires-python = ">=3.13"

dependencies = [
    "scikit-learn",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]